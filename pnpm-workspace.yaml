packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency install scripts unless listed here.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - prisma

# Security overrides for transitive dependencies with no fixed parent release yet (SEC-013).
# Remove each one when the parent ships the fix.
overrides:
  # GHSA-3f6p-5ww8-9rcr, via prisma 7.10.0.
  mysql2@<3.22.0: ^3.22.0
  # GHSA-ggr8-5vv4-36mx, via @prisma/config 7.10.0.
  deepmerge-ts@<8.0.0: ^8.0.0

# Advisories with no fixed release, accepted after review (reasons and review dates in
# infra/ci/README.md). Remove each one when a fix ships.
auditConfig:
  ignoreGhsas:
    # node-forge, only in Expo's build tools (certificates); never in an app bundle.
    - GHSA-86w9-cpqp-85rv
    # braces, only in Jest's and Metro's matching of the repository's own file patterns.
    - GHSA-vfj7-8cjw-p6xm
