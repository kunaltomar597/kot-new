name: Android

# Builds debug APKs of the waiter app and the table tablet with Gradle (P2-01c), so native
# configuration (Expo modules, the Keystore device key module, autolinking in the monorepo, the
# alert service and its permissions) is checked on every change that could affect it. Signed
# release APKs are built by EAS Build with the owner's keystore held as an EAS secret, never here.

on:
  push:
    branches: [main]
    paths:
      - 'apps/waiter-app/**'
      - 'apps/table-tablet/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/waiter-app/**'
      - 'apps/table-tablet/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [waiter-app, table-tablet]
    env:
      APP_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@rp/${{ matrix.app }}^...

      - name: Bundle the JavaScript with Metro
        run: pnpm --filter @rp/${{ matrix.app }} bundle:check

      - name: Generate the Android project
        run: pnpm --filter @rp/${{ matrix.app }} prebuild

      - name: Assemble the debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      # The waiter phone's background alerts (P2-06b) need notifications and a foreground service;
      # the table tablet alerts nobody and blocks them (SEC-002 least privilege).
      - name: Check the alert permissions and service in the APK
        working-directory: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          "$aapt2" dump permissions app-debug.apk | tee permissions.txt
          "$aapt2" dump xmltree --file AndroidManifest.xml app-debug.apk > manifest.txt
          for permission in POST_NOTIFICATIONS FOREGROUND_SERVICE_SPECIAL_USE; do
            if grep -q "android.permission.$permission'" permissions.txt; then
              [ "${{ matrix.app }}" = waiter-app ] || { echo "::error::The table tablet asks for $permission"; exit 1; }
            else
              [ "${{ matrix.app }}" != waiter-app ] || { echo "::error::The waiter app lacks $permission"; exit 1; }
            fi
          done
          # The tablet's kiosk (P3-01b): its device-admin receiver, bindable only by the system.
          if [ "${{ matrix.app }}" = table-tablet ]; then
            grep -A8 'com.rp.mobilenative.RpDeviceAdminReceiver' manifest.txt | tee admin.txt
            grep -q 'android.permission.BIND_DEVICE_ADMIN' admin.txt || {
              echo '::error::The device-admin receiver is not protected by BIND_DEVICE_ADMIN'
              exit 1
            }
          fi
          # The in-app updater (P7-04e2): both apps may install their own new APK from the PC,
          # and Android's answers reach only the app's own receivers.
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES'" permissions.txt || {
            echo '::error::The app cannot install its own updates (REQUEST_INSTALL_PACKAGES)'
            exit 1
          }
          for receiver in RpApkInstallReceiver RpPackageReplacedReceiver; do
            grep -B4 -A4 "com.rp.mobilenative.$receiver" manifest.txt | tee receiver.txt
            grep -q -E 'exported.*(0x0$|false)' receiver.txt || {
              echo "::error::$receiver must not be exported"
              exit 1
            }
          done
          if [ "${{ matrix.app }}" = waiter-app ]; then
            grep -A6 'com.rp.mobilenative.RpAlertService' manifest.txt | tee service.txt
            grep -q -E 'foregroundServiceType.*(0x40000000|1073741824|specialUse)' service.txt || {
              echo '::error::The alert service is not a specialUse foreground service'
              exit 1
            }
          fi

      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
