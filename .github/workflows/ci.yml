name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # PostgreSQL for server integration tests (apps/server/test/setup/postgres.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Contract docs are up to date
        run: pnpm contracts:docs:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Requirements catalogue is up to date
        run: |
          pnpm brd:catalog
          git diff --exit-code -- docs/brd/requirements.json docs/brd/requirements.md

      - name: Traceability report
        run: |
          pnpm trace
          git diff --exit-code -- docs/build/TRACEABILITY.md || (echo "Run 'pnpm trace' and commit docs/build/TRACEABILITY.md" && exit 1)

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # PostgreSQL for the console end-to-end tests (apps/console/e2e/global-setup.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build server and console
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @rp/console exec playwright install --with-deps chromium

      - name: Console end-to-end tests
        run: pnpm --filter @rp/console e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
