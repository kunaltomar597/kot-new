plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rp.mobilenative'
version = '0.1.0'

android {
  namespace "com.rp.mobilenative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // LanTrust hooks React Native's OkHttp clients (fetch, XHR, WebSocket, images); the versions
  // come from React Native.
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
