# Smoke flow (P2-01c, P2-02a to P2-02c; WTR-001 to WTR-003, WTR-007, TBL-003, WTR-008, WTR-012):
# pair with the local server, sign a waiter in, see the live tables, open a free table, find a dish,
# send the KOT and see it reach the kitchen, serve it once the kitchen has it ready, then ask for
# the bill. TABLE must be free; DISH must be a dish without options on the waiter-app menu. While
# the flow waits for the dish to be ready (up to 5 minutes), a person marks it Ready on the kitchen
# screen (the console in Kitchen mode). Run against a development build with Metro running (see
# apps/waiter-app/README.md):
#   maestro test -e PAIRING_CODE=ABCD-EFGH -e TABLE=T1 -e "DISH=Dal Makhani" apps/waiter-app/.maestro
appId: ${APP_ID}
env:
  APP_ID: in.rp.waiter.dev
  METRO: http://10.0.2.2:8081
  SERVER: http://10.0.2.2:3000
  STAFF_NAME: Ravi
  PIN: '4444'
  TABLE: T1
  DISH: Dal Makhani
---
- launchApp:
    clearState: true
- openLink: exp+rp-waiter://expo-development-client/?url=${METRO}
- extendedWaitUntil:
    visible:
      id: pairing-server
    timeout: 60000
- tapOn:
    id: pairing-server
- inputText: ${SERVER}
- tapOn:
    id: pairing-code
- inputText: ${PAIRING_CODE}
- hideKeyboard
- tapOn:
    id: pairing-submit
- tapOn: ${STAFF_NAME}
- tapOn: ${PIN.charAt(0)}
- tapOn: ${PIN.charAt(1)}
- tapOn: ${PIN.charAt(2)}
- tapOn: ${PIN.charAt(3)}
- assertVisible: Tables
- assertVisible: Signed in as ${STAFF_NAME}
- tapOn: All tables
- tapOn: ${TABLE}, Free.*
- tapOn: One more
- tapOn:
    id: open-table
- assertVisible: ${TABLE} is open
- assertVisible: Table ${TABLE}
- tapOn: Add from the menu
- tapOn:
    id: menu-search
- inputText: ${DISH}
- hideKeyboard
- tapOn: ${DISH},.*
- assertVisible: 1 new item.*
- tapOn:
    id: send-kot
- assertVisible: Order .* sent to the kitchen
- assertVisible: KOT .*
# The kitchen marks the dish Ready on its screen; the phone shows it live.
- extendedWaitUntil:
    visible: Mark ${DISH} served
    timeout: 300000
- tapOn: Mark ${DISH} served
- assertVisible: Served
- tapOn: Request bill
- assertVisible: The cashier has been asked for the bill for ${TABLE}.
- tapOn: Back to tables
- tapOn: Sign out
- assertVisible: Tap your name
