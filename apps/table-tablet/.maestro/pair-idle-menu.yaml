# Smoke flow (P2-01c, P3-01b): pair the tablet to its table, with no login, and see the idle
# screen of a free table. Run against a development build with Metro running (see
# apps/table-tablet/README.md):
#   maestro test -e PAIRING_CODE=ABCD-EFGH apps/table-tablet/.maestro/pair-idle-menu.yaml
appId: ${APP_ID}
env:
  APP_ID: in.rp.tablet.dev
  METRO: http://10.0.2.2:8081
  SERVER: http://10.0.2.2:3000
---
- launchApp:
    clearState: true
- openLink: exp+rp-table-tablet://expo-development-client/?url=${METRO}
- extendedWaitUntil:
    visible:
      id: pairing-server
    timeout: 60000
- tapOn:
    id: pairing-server
- inputText: ${SERVER}
- tapOn:
    id: pairing-code
- inputText: ${PAIRING_CODE}
- hideKeyboard
- tapOn:
    id: pairing-submit
# A free table: the idle screen (P3-01b, TAB-003).
- extendedWaitUntil:
    visible:
      id: idle-screen
    timeout: 15000
- assertVisible: Please wait to be seated
