# Supabase CLI configuration for the QR relay (C8, ADR-0015). Local stack:
# `supabase start --workdir infra` (Docker), which applies ./migrations. The hosted project lives
# in the Mumbai region (ap-south-1); see manual-tasks/13-supabase-relay.md.
project_id = "rp-relay"

[api]
enabled = true
port = 54321
# The relay schema is never exposed through the Data API (ADR-0015): browsers and local servers
# reach it only through edge functions, and local servers' Realtime subscriptions.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

# Menu photos (MENU-008): public through the CDN, written only by edge functions for the
# restaurant's own folder (P5-03). The local server re-encodes and strips EXIF first (SEC-004).
# WebP only, as in the migrations (RELAY-T8): the `server` function stores nothing else.
[storage.buckets.menu-photos]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/webp"]

[auth]
# No user accounts in the relay: diners are anonymous and local servers hold scoped credentials.
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
deno_version = 2

[analytics]
enabled = false

# Edge functions (P5-02): bundled from src/ into dist/functions by `pnpm --filter @rp/relay build`.
# Diners' browsers carry a table's QR token, not a Supabase JWT, so the platform's JWT check is
# off for them; each function checks the token itself (ADR-0015).
[functions.qr-menu]
verify_jwt = false
entrypoint = "./dist/functions/qr-menu/index.js"

[functions.submit-order]
verify_jwt = false
entrypoint = "./dist/functions/submit-order/index.js"

[functions.order-status]
verify_jwt = false
entrypoint = "./dist/functions/order-status/index.js"

# The restaurant's local server: checked by its credential, not a Supabase JWT (ADR-0015).
[functions.server]
verify_jwt = false
entrypoint = "./dist/functions/server/index.js"

[functions.service-request]
verify_jwt = false
entrypoint = "./dist/functions/service-request/index.js"
